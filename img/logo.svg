<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Setas</title>
  <style>
    .sombrero, .pie-seta { fill: #245a3d; }
    .gota { fill: #b27a0e; }
    @media (prefers-color-scheme: dark) {
